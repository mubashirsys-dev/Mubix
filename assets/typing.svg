<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&amp;display=swap');
      
      .text-bg {
        font-family: 'Space Mono', monospace;
        font-size: 24px;
        font-weight: 700;
        fill: #00ffcc;
        opacity: 0;
      }
      
      .cursor {
        fill: #ff007f;
        animation: blink 0.8s infinite;
      }
      
      /* Animation Sequence */
      @keyframes type1 {
        0%, 15% { opacity: 1; width: 0; }
        3%, 12% { opacity: 1; }
        14% { opacity: 0; }
      }
      @keyframes type2 {
        16%, 35% { opacity: 1; }
        34% { opacity: 0; }
      }
      @keyframes type3 {
        36%, 55% { opacity: 1; }
        54% { opacity: 0; }
      }
      @keyframes type4 {
        56%, 75% { opacity: 1; }
        74% { opacity: 0; }
      }
      @keyframes type5 {
        76%, 98% { opacity: 1; }
        97% { opacity: 0; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      .line-1 { animation: type1 15s infinite; }
      .line-2 { animation: type2 15s infinite; }
      .line-3 { animation: type3 15s infinite; }
      .line-4 { animation: type4 15s infinite; }
      .line-5 { animation: type5 15s infinite; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#0d0b11" rx="8" stroke="#00ffcc" stroke-width="2" />
  
  <!-- Terminal Header -->
  <g transform="translate(15, 25)">
    <circle cx="0" cy="0" r="5" fill="#ff5f56" />
    <circle cx="15" cy="0" r="5" fill="#ffbd2e" />
    <circle cx="30" cy="0" r="5" fill="#27c93f" />
    <text x="50" y="5" font-family="'Space Mono', monospace" font-size="12" fill="#666">mubix-prompt-terminal.sh</text>
  </g>

  <!-- Interactive Typewriter Text -->
  <g transform="translate(30, 75)">
    <!-- Terminal Prompt Indicator -->
    <text x="0" y="0" font-family="'Space Mono', monospace" font-size="24" font-weight="700" fill="#ff007f">&gt; </text>
    
    <!-- Word 1 -->
    <g class="line-1">
      <text x="35" y="0" class="text-bg">MUBIX Portfolio</text>
    </g>
    
    <!-- Word 2 -->
    <g class="line-2">
      <text x="35" y="0" class="text-bg">Creative Developer Experience</text>
    </g>
    
    <!-- Word 3 -->
    <g class="line-3">
      <text x="35" y="0" class="text-bg">Cyberpunk + Brutalist UI</text>
    </g>
    
    <!-- Word 4 -->
    <g class="line-4">
      <text x="35" y="0" class="text-bg">Interactive AI Portfolio</text>
    </g>
    
    <!-- Word 5 -->
    <g class="line-5">
      <text x="35" y="0" class="text-bg">Modern Indie Hacker Aesthetic</text>
    </g>
  </g>
</svg>
